<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#04020a">
  <title>Nova Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --bg: #04020a; --panel: rgba(10, 6, 22, .92); --line: rgba(167, 139, 250, .16); --line-strong: rgba(167, 139, 250, .34);
      --txt: #f1ecff; --dim: rgba(225, 214, 255, .66); --faint: rgba(200, 186, 245, .44); --violet: #a78bfa; --violet-hi: #d8b4fe;
      --tile: linear-gradient(150deg, #2b1857 0%, #160c2e 60%, #0d0720 100%);
      --ui: 'Space Grotesk', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace; --display: 'Orbitron', var(--ui);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--txt); font: 14px/1.5 var(--ui); overflow: hidden; }
    button, input, select { font: inherit; color: inherit; }
    svg { display: block; }
    .ico { width: 16px; height: 16px; }

    /* tabs */
    .tabs { display: flex; align-items: flex-end; gap: 4px; height: 38px; padding: 6px 8px 0; background: #05030c; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { display: flex; align-items: center; gap: 8px; height: 32px; min-width: 120px; max-width: 220px; flex: 0 1 200px; padding: 0 6px 0 12px; border: 1px solid transparent; border-bottom: 0; border-radius: 10px 10px 0 0;
      background: transparent; color: var(--dim); cursor: pointer; font-size: 12.5px; transition: background .15s, color .15s; }
    .tab:hover { background: rgba(167, 139, 250, .07); color: var(--txt); }
    .tab.on { background: var(--panel); border-color: var(--line); color: var(--txt); box-shadow: inset 0 2px 0 var(--violet); }
    .tab .fav { width: 16px; height: 16px; border-radius: 4px; flex: none; display: grid; place-items: center; background: var(--tile); border: 1px solid var(--line-strong); font: 600 9px var(--mono); color: var(--violet-hi); }
    .tab .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
    .tab .x { width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--faint); flex: none; }
    .tab .x:hover { background: rgba(167, 139, 250, .16); color: var(--txt); }
    .tab .x svg { width: 12px; height: 12px; }
    .newtab { width: 30px; height: 30px; margin-bottom: 1px; border: 0; border-radius: 8px; background: transparent; color: var(--dim); display: grid; place-items: center; cursor: pointer; flex: none; }
    .newtab:hover { background: rgba(167, 139, 250, .12); color: var(--txt); }

    /* toolbar */
    .bar { display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 8px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
    .ib { width: 34px; height: 34px; border: 0; border-radius: 9px; background: transparent; color: var(--dim); display: grid; place-items: center; cursor: pointer; flex: none; transition: background .15s, color .15s; }
    .ib:hover { background: rgba(167, 139, 250, .12); color: var(--txt); }
    .ib:disabled { opacity: .35; pointer-events: none; }
    .addr { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 10px; background: rgba(167, 139, 250, .06); border: 1px solid var(--line); transition: border-color .2s, box-shadow .2s; }
    .addr:focus-within { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(139, 92, 246, .18); }
    .addr svg { width: 14px; height: 14px; color: var(--violet); flex: none; }
    .addr input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 400 13px var(--mono); color: var(--txt); }
    .addr input::placeholder { color: var(--faint); font-family: var(--ui); }
    .srv { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: rgba(139, 92, 246, .1); cursor: pointer; font: 500 12px var(--mono); letter-spacing: .04em; white-space: nowrap; flex: none; }
    .srv:hover { background: rgba(139, 92, 246, .2); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
    .dot.ok { background: #a78bfa; box-shadow: 0 0 8px #a78bfa; }
    .dot.bad { background: #6b5a8e; }

    /* views */
    .views { position: relative; flex: 1; min-height: 0; }
    .view { position: absolute; inset: 0; display: none; }
    .view.on { display: block; }
    .view iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

    /* new tab page */
    .ntp { position: absolute; inset: 0; overflow: auto; display: grid; place-items: center; padding: 32px 16px;
      background: radial-gradient(ellipse at 30% 20%, rgba(124, 58, 237, .22), transparent 55%), radial-gradient(ellipse at 75% 80%, rgba(76, 29, 149, .3), transparent 55%), var(--bg); }
    .ntp::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .55;
      background-image: radial-gradient(1px 1px at 12% 22%, #e9d5ff, transparent), radial-gradient(1px 1px at 72% 12%, #fff, transparent), radial-gradient(1px 1px at 42% 68%, #c4b5fd, transparent), radial-gradient(1.5px 1.5px at 86% 52%, #e9d5ff, transparent), radial-gradient(1px 1px at 22% 82%, #fff, transparent), radial-gradient(1px 1px at 58% 36%, #ddd6fe, transparent), radial-gradient(1px 1px at 92% 88%, #fff, transparent), radial-gradient(1px 1px at 6% 56%, #c4b5fd, transparent); }
    .ntp-in { position: relative; width: min(660px, 100%); display: grid; gap: 22px; justify-items: center; text-align: center; }
    .brand { font: 500 clamp(34px, 7vw, 60px)/1 var(--display); letter-spacing: .32em; margin-right: -.32em; text-shadow: 0 0 28px rgba(167, 139, 250, .6); }
    .brand-sub { font: 500 11px var(--mono); letter-spacing: .4em; color: var(--faint); margin-top: -12px; }
    .big-search { width: 100%; display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 8px 0 18px; border-radius: 14px; background: rgba(8, 5, 18, .7); border: 1px solid var(--line-strong); transition: border-color .2s, box-shadow .25s; }
    .big-search:focus-within { border-color: var(--violet); box-shadow: 0 0 0 4px rgba(139, 92, 246, .18), 0 0 40px -10px rgba(139, 92, 246, .7); }
    .big-search svg { width: 18px; height: 18px; color: var(--violet); flex: none; }
    .big-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; }
    .big-search input::placeholder { color: var(--faint); }
    .go { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line-strong); background: rgba(139, 92, 246, .16); color: var(--violet-hi); display: grid; place-items: center; cursor: pointer; flex: none; }
    .go:hover { background: rgba(139, 92, 246, .3); }
    .links { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
    .lk { display: grid; justify-items: center; gap: 8px; padding: 14px 6px; border-radius: 12px; border: 1px solid var(--line); background: rgba(14, 9, 30, .55); cursor: pointer; font-size: 12.5px; color: var(--dim); transition: border-color .2s, background .2s, transform .2s; }
    .lk:hover { border-color: rgba(167, 139, 250, .5); background: rgba(139, 92, 246, .12); color: var(--txt); transform: translateY(-2px); }
    .lk b { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--tile); border: 1px solid var(--line-strong); font: 600 16px var(--display); color: var(--violet-hi); box-shadow: 0 0 18px -8px rgba(139, 92, 246, .9); }
    .note { width: 100%; text-align: left; padding: 14px 16px; border-radius: 12px; border: 1px dashed var(--line-strong); background: rgba(8, 5, 18, .6); color: var(--dim); font-size: 13px; display: block; line-height: 1.6; }
    .note b { display: block; margin-bottom: 4px; color: var(--txt); font-weight: 600; }
    .note > span { display: block; margin-top: 12px; }
    .note code { font: 12px var(--mono); color: var(--violet-hi); }
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-strong); background: rgba(139, 92, 246, .18); color: var(--txt); cursor: pointer; font: 500 12px var(--mono); letter-spacing: .06em; }
    .btn:hover { background: rgba(139, 92, 246, .32); }
    .status { font: 400 11.5px var(--mono); color: var(--faint); letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }

    /* server menu */
    .menu { position: absolute; top: 90px; right: 8px; z-index: 20; width: min(360px, calc(100vw - 16px)); padding: 14px; border-radius: 14px; background: rgba(8, 5, 18, .97); border: 1px solid var(--line-strong);
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .9), 0 0 60px -24px rgba(139, 92, 246, .8); display: none; gap: 12px; }
    .menu.on { display: grid; }
    .lbl { font: 500 10.5px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--faint); }
    .opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 9px; border: 1px solid transparent; background: transparent; cursor: pointer; text-align: left; }
    .opt:hover { background: rgba(167, 139, 250, .1); }
    .opt.on { border-color: var(--line-strong); background: rgba(139, 92, 246, .14); }
    .opt span { flex: 1; min-width: 0; display: grid; }
    .opt small { font: 11px var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .opt .rm { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--faint); }
    .opt .rm:hover { background: rgba(167, 139, 250, .18); color: var(--txt); }
    .field { display: flex; gap: 6px; }
    .field input, .menu select { flex: 1; min-width: 0; height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: rgba(167, 139, 250, .06); outline: 0; font: 12px var(--mono); }
    .field input:focus, .menu select:focus { border-color: var(--violet); }
    .menu select { width: 100%; font-family: var(--ui); font-size: 13px; }
    .menu option { background: #0b0716; }
    .err { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: var(--bg); }
    .err .note { max-width: 520px; }
    .loading { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--violet-hi), transparent); background-size: 50% 100%; animation: ld 1s linear infinite; display: none; z-index: 5; }
    .loading.on { display: block; }
    @keyframes ld { from { background-position: -50% 0; } to { background-position: 150% 0; } }
    @media (max-width: 600px) { .srv .nm { display: none; } .tab { min-width: 90px; } }
  </style>
</head>
<body>
  <div class="tabs" id="tabs" role="tablist" aria-label="Tabs"></div>
  <div class="bar">
    <button class="ib" id="back" aria-label="Back"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="ib" id="fwd" aria-label="Forward"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    <button class="ib" id="reload" aria-label="Reload"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="ib" id="home" aria-label="New tab page"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <form class="addr" id="addr-form" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input id="addr" placeholder="Search or enter a website" autocomplete="off" spellcheck="false" aria-label="Address">
    </form>
    <button class="srv" id="srv" aria-label="Server"><i class="dot" id="srv-dot"></i><span class="nm" id="srv-name">Server</span><svg class="ico" style="width:12px;height:12px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
  <div class="views" id="views"><div class="loading" id="loading"></div></div>

  <div class="menu" id="menu" role="dialog" aria-label="Browser settings">
    <div class="lbl">Server</div>
    <div id="srv-list" style="display:grid;gap:4px"></div>
    <div class="lbl" style="margin-top:4px">Bring your own server</div>
    <form class="field" id="add-form"><input id="add-url" placeholder="wss://example.com/wisp/" spellcheck="false" aria-label="Wisp server address"><button class="btn" type="submit">Add</button></form>
    <div class="lbl" style="margin-top:4px">Search engine</div>
    <select id="engine" aria-label="Search engine">
      <option value="https://duckduckgo.com/?q=%s">DuckDuckGo</option>
      <option value="https://www.google.com/search?q=%s">Google</option>
      <option value="https://www.bing.com/search?q=%s">Bing</option>
      <option value="https://search.brave.com/search?q=%s">Brave Search</option>
    </select>
  </div>

  <script src="config.js"></script>
  <script src="lib/scram/scramjet.all.js"></script>
  <script src="lib/baremux/index.js"></script>
  <script>
  (function () {
    'use strict';
    const CFG = window.NOVA_PROXY || { servers: [] };
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const ls = { get(k, d) { try { const v = localStorage.getItem('nova.proxy.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                 set(k, v) { try { localStorage.setItem('nova.proxy.' + k, JSON.stringify(v)); } catch (e) {} } };
    const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';

    /* ---------------- servers ---------------- */
    const servers = () => (CFG.servers || []).map((s) => ({ name: s.name, url: s.url, own: false }))
      .concat(ls.get('custom', []).map((u, i) => ({ name: 'My server' + (i ? ' ' + (i + 1) : ''), url: u, own: true })));
    const current = () => { const list = servers(), saved = ls.get('server', null); return list.find((s) => s.url === saved) || list[0] || null; };
    const engine = () => ls.get('engine', CFG.searchEngine || 'https://duckduckgo.com/?q=%s');

    /* ---------------- scramjet ---------------- */
    let sj = null, conn = null, bootP = null, transportFor = null;
    const libsOk = typeof window.$scramjetLoadController === 'function' && typeof window.BareMux === 'object';
    function boot() {
      if (bootP) return bootP;
      bootP = (async () => {
        if (!libsOk) throw new Error('libs');
        if (!('serviceWorker' in navigator)) throw new Error('nosw');
        // Scramjet's database must be created by this page (with its tables) BEFORE the
        // service worker touches it — the worker opens it without creating any tables.
        await ensureDb();
        const { ScramjetController } = $scramjetLoadController();
        sj = new ScramjetController({
          prefix: '/proxy/scramjet/',
          files: { wasm: '/proxy/lib/scram/scramjet.wasm.wasm', all: '/proxy/lib/scram/scramjet.all.js', sync: '/proxy/lib/scram/scramjet.sync.js' }
        });
        await sj.init();
        await navigator.serviceWorker.register('/proxy/sw.js', { scope: '/proxy/' });
        await navigator.serviceWorker.ready;
        conn = new BareMux.BareMuxConnection('/proxy/lib/baremux/worker.js');
      })();
      bootP.catch(() => { bootP = null; });
      return bootP;
    }
    const STORES = ['config', 'cookies', 'redirectTrackers', 'referrerPolicies', 'publicSuffixList'];
    function openDb() {
      return new Promise((res, rej) => {
        const r = indexedDB.open('$scramjet', 1);
        r.onupgradeneeded = () => { STORES.forEach((n) => { if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    }
    async function ensureDb() {
      const db = await openDb();
      const ok = STORES.every((n) => db.objectStoreNames.contains(n)); db.close();
      if (ok) { sessionStorage.removeItem('nova.proxy.dbfix'); return; }
      // An older visit let the service worker create an empty database. Remove it and start clean (once).
      if (sessionStorage.getItem('nova.proxy.dbfix')) throw new Error('The browser’s storage is stuck. Close this tab, reopen Nova and try again.');
      sessionStorage.setItem('nova.proxy.dbfix', '1');
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter((r) => r.scope.includes('/proxy/')).map((r) => r.unregister()));
      await new Promise((res) => { const d = indexedDB.deleteDatabase('$scramjet'); d.onsuccess = d.onerror = res; d.onblocked = () => setTimeout(res, 1500); });
      location.reload();
      await new Promise(() => {});
    }
    async function useServer() {
      const s = current(); if (!s) throw new Error('noserver');
      if (transportFor !== s.url) { await conn.setTransport('/proxy/lib/libcurl/index.mjs', [{ websocket: s.url }]); transportFor = s.url; }
    }

    /* ---------------- url helpers ---------------- */
    function toUrl(input) {
      const v = input.trim(); if (!v) return null;
      try { const u = new URL(v); if (/^https?:$/.test(u.protocol)) return u.href; } catch (e) {}
      if (/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/i.test(v) && !/\s/.test(v)) return 'https://' + v;
      return engine().replace('%s', encodeURIComponent(v));
    }
    const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };

    /* ---------------- tabs ---------------- */
    const tabs = []; let active = null, seq = 0;
    function newTab(input) {
      const t = { id: ++seq, url: '', title: 'New tab', frame: null, view: document.createElement('div') };
      t.view.className = 'view'; $('views').appendChild(t.view);
      tabs.push(t); select(t);
      if (input) go(t, input); else showNtp(t);
      return t;
    }
    function closeTab(t) {
      const i = tabs.indexOf(t); if (i < 0) return;
      t.view.remove(); tabs.splice(i, 1);
      if (!tabs.length) { newTab(); return; }
      if (active === t) select(tabs[Math.max(0, i - 1)]);
      paintTabs();
    }
    function select(t) { active = t; tabs.forEach((x) => x.view.classList.toggle('on', x === t)); paintTabs(); paintBar(); }
    function paintTabs() {
      $('tabs').innerHTML = tabs.map((t) => '<div class="tab' + (t === active ? ' on' : '') + '" role="tab" aria-selected="' + (t === active) + '" data-tab="' + t.id + '" tabindex="0"><span class="fav">' + esc((host(t.url) || 'N')[0].toUpperCase()) + '</span><span class="t">' + esc(t.title || host(t.url) || 'New tab') + '</span><button class="x" data-close="' + t.id + '" aria-label="Close tab">' + X + '</button></div>').join('') +
        '<button class="newtab" id="newtab" aria-label="New tab"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>';
    }
    function paintBar() {
      const t = active; const has = !!(t && t.frame);
      $('back').disabled = !has; $('fwd').disabled = !has; $('reload').disabled = !has;
      if (document.activeElement !== $('addr')) $('addr').value = t && t.url ? t.url : '';
      const s = current(); $('srv-name').textContent = s ? s.name : 'No server';
      $('srv-dot').className = 'dot ' + (s ? (transportFor === s.url ? 'ok' : '') : 'bad');
    }
    function loading(on) { $('loading').classList.toggle('on', !!on); }

    function showNtp(t) {
      if (t.frame) { t.frame.frame.remove(); t.frame = null; }
      t.url = ''; t.title = 'New tab';
      const s = current();
      const links = (CFG.quickLinks || []).map((l) => '<button class="lk" data-go="' + esc(l.url) + '"><b>' + esc(l.name[0]) + '</b>' + esc(l.name) + '</button>').join('');
      t.view.innerHTML = '<div class="ntp"><div class="ntp-in"><div class="brand">NOVA</div><div class="brand-sub">BROWSER</div>' +
        '<form class="big-search ntp-form"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="ntp-q" placeholder="Search the web or type a URL" autocomplete="off" spellcheck="false" aria-label="Search the web or type a URL"><button class="go" aria-label="Go"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button></form>' +
        '<div class="links">' + links + '</div>' +
        (libsOk ? (s ? '<div class="status"><i class="dot ' + (transportFor === s.url ? 'ok' : '') + '"></i>Connected through ' + esc(s.name) + '</div>'
          : '<div class="note"><b>No server set up yet</b>The browser needs a Wisp server to reach websites. Add one in <code>proxy/config.js</code>, or paste your own address in the server menu (top right).<span><button class="btn open-menu" type="button">Add a server</button></span></div>')
          : '<div class="note"><b>Browser files aren’t built here</b>Scramjet is downloaded when the site deploys on Vercel (<code>npm run build:proxy</code>). Run that locally to test.</div>') +
        '</div></div>';
      const q = t.view.querySelector('.ntp-q');
      t.view.querySelector('.ntp-form').addEventListener('submit', (e) => { e.preventDefault(); if (q.value.trim()) go(t, q.value); });
      t.view.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => go(t, b.dataset.go)));
      const om = t.view.querySelector('.open-menu'); if (om) om.addEventListener('click', openMenu);
      paintTabs(); paintBar();
      if (t === active) setTimeout(() => q.focus(), 30);
    }
    function showErr(t, title, body) {
      t.view.innerHTML = '<div class="err"><div class="note"><b>' + esc(title) + '</b>' + body + '<span><button class="btn retry" type="button">Try again</button> <button class="btn open-menu" type="button">Servers</button></span></div></div>';
      const u = t.pending; t.view.querySelector('.retry').addEventListener('click', () => go(t, u));
      t.view.querySelector('.open-menu').addEventListener('click', openMenu);
    }

    async function go(t, input) {
      const url = toUrl(input); if (!url) return;
      t.pending = url; t.url = url; t.title = host(url); paintTabs(); paintBar(); loading(true);
      try { sessionStorage.setItem('nova.proxy.resume', url); } catch (e) {}
      try { await boot(); await useServer(); }
      catch (e) {
        loading(false);
        try { sessionStorage.removeItem('nova.proxy.resume'); } catch (x) {}
        if (t.frame) { t.frame.frame.remove(); t.frame = null; }
        if (e.message === 'noserver') showErr(t, 'No server set up', 'Pick or add a Wisp server in the server menu, then try again.');
        else if (e.message === 'libs') showErr(t, 'Browser files aren’t built', 'Scramjet is installed when the site deploys (<code>npm run build:proxy</code>).');
        else if (e.message === 'nosw') showErr(t, 'Service workers are blocked', 'This browser or network doesn’t allow service workers, which the Nova Browser needs.');
        else showErr(t, 'Couldn’t start the browser', '<code>' + esc(e.message || e) + '</code>');
        paintBar(); return;
      }
      if (!t.frame) {
        t.view.innerHTML = '';
        const f = sj.createFrame(); f.frame.setAttribute('allow', 'fullscreen; autoplay; clipboard-read; clipboard-write; camera; microphone; geolocation');
        t.view.appendChild(f.frame); t.frame = f;
        f.addEventListener('urlchange', (e) => { t.url = e.url; t.title = host(e.url); if (t === active) paintBar(); paintTabs(); });
        f.frame.addEventListener('load', () => {
          loading(false);
          try { const d = f.frame.contentDocument; if (d && d.title) t.title = d.title; } catch (e) {}
          paintTabs(); if (t === active) paintBar();
        });
      }
      try { sessionStorage.removeItem('nova.proxy.resume'); } catch (e) {}
      t.frame.go(url); paintBar();
    }

    /* ---------------- menu ---------------- */
    function paintMenu() {
      const list = servers(), cur = current();
      $('srv-list').innerHTML = list.length ? list.map((s) => '<button class="opt' + (cur && cur.url === s.url ? ' on' : '') + '" data-srv="' + esc(s.url) + '"><i class="dot ' + (transportFor === s.url ? 'ok' : '') + '"></i><span><b>' + esc(s.name) + '</b><small>' + esc(s.url) + '</small></span>' + (s.own ? '<i class="rm" data-rm="' + esc(s.url) + '" aria-label="Remove">' + X + '</i>' : '') + '</button>').join('')
        : '<p class="status" style="margin:0">No servers yet — add one below.</p>';
      $('engine').value = engine();
    }
    function openMenu() { paintMenu(); $('menu').classList.add('on'); }
    function closeMenu() { $('menu').classList.remove('on'); }
    $('srv').addEventListener('click', (e) => { e.stopPropagation(); $('menu').classList.contains('on') ? closeMenu() : openMenu(); });
    document.addEventListener('pointerdown', (e) => { if (!e.target.closest('#menu, #srv')) closeMenu(); });
    $('srv-list').addEventListener('click', (e) => {
      const rm = e.target.closest('[data-rm]');
      if (rm) { e.stopPropagation(); ls.set('custom', ls.get('custom', []).filter((u) => u !== rm.dataset.rm)); if (ls.get('server') === rm.dataset.rm) ls.set('server', null); paintMenu(); paintBar(); return; }
      const b = e.target.closest('[data-srv]'); if (!b) return;
      ls.set('server', b.dataset.srv); paintMenu(); paintBar();
      if (active && active.url) go(active, active.url);
    });
    $('add-form').addEventListener('submit', (e) => {
      e.preventDefault(); let v = $('add-url').value.trim(); if (!v) return;
      if (/^https?:\/\//i.test(v)) v = v.replace(/^http/i, 'ws');
      if (!/^wss?:\/\//i.test(v)) v = 'wss://' + v;
      const c = ls.get('custom', []); if (!c.includes(v)) c.push(v); ls.set('custom', c); ls.set('server', v);
      $('add-url').value = ''; paintMenu(); paintBar();
      if (active && !active.frame) showNtp(active);
    });
    $('engine').addEventListener('change', (e) => ls.set('engine', e.target.value));

    /* ---------------- chrome ---------------- */
    $('tabs').addEventListener('click', (e) => {
      const c = e.target.closest('[data-close]'); if (c) { e.stopPropagation(); closeTab(tabs.find((t) => t.id === +c.dataset.close)); return; }
      if (e.target.closest('#newtab')) { newTab(); return; }
      const t = e.target.closest('[data-tab]'); if (t) select(tabs.find((x) => x.id === +t.dataset.tab));
    });
    $('tabs').addEventListener('auxclick', (e) => { const t = e.target.closest('[data-tab]'); if (t && e.button === 1) closeTab(tabs.find((x) => x.id === +t.dataset.tab)); });
    $('addr-form').addEventListener('submit', (e) => { e.preventDefault(); const v = $('addr').value; $('addr').blur(); if (v.trim()) go(active, v); });
    $('addr').addEventListener('focus', () => $('addr').select());
    $('back').addEventListener('click', () => active.frame && active.frame.back());
    $('fwd').addEventListener('click', () => active.frame && active.frame.forward());
    $('reload').addEventListener('click', () => { if (active.frame) { loading(true); active.frame.reload(); } });
    $('home').addEventListener('click', () => showNtp(active));
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') { e.preventDefault(); $('addr').focus(); }
      if (e.key === 'Escape') closeMenu();
    });

    /* messages from the Nova desktop (search bar → browser) */
    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin || !e.data || e.data.nova !== 'go') return;
      if (active && !active.frame && !active.url) go(active, e.data.q); else newTab(e.data.q);
    });

    const first = decodeURIComponent((location.hash.match(/[#&]q=([^&]*)/) || [])[1] || '') || sessionStorage.getItem('nova.proxy.resume') || '';
    sessionStorage.removeItem('nova.proxy.resume');
    if (first) history.replaceState(null, '', location.pathname);
    newTab(first || null);
    if (libsOk && current()) boot().then(useServer).then(() => { paintBar(); if (active && !active.frame) showNtp(active); }).catch(() => {});
  })();
  </script>
</body>
</html>
