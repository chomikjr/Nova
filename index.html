<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04020a">
  <meta name="description" content="Nova OS — a free game desktop in your browser. 400+ games, a built-in web browser, achievements, XP, daily and weekly challenges and cloud saves.">
  <title>Nova OS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c4b5fd' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="assets/core.css">
  <link rel="stylesheet" href="assets/os.css">
  <link rel="stylesheet" href="assets/galaxy.css">
</head>
<body class="os">
  <div class="boot" id="boot" aria-hidden="true"><div class="boot-in"><div class="boot-logo">NOVA</div><div class="boot-bar"><i></i></div></div></div>

  <main class="os-home" id="os-home" aria-label="Desktop">
    <div class="desk">
      <section class="desk-hero">
        <h1 class="os-day" id="os-day">MONDAY</h1>
        <div class="os-date" id="os-date"></div>
        <form class="hero-search" id="hero-form" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="hero-q" type="text" placeholder="Search games or the web" autocomplete="off" aria-label="Search games or the web">
          <button type="submit" aria-label="Go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
        </form>
        <div class="hero-links" id="hero-links">
          <button type="button" data-hero="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="2"/></svg>Games</button>
          <button type="button" data-hero="browser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>Browser</button>
          <button type="button" data-hero="music"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Music</button>
          <button type="button" data-hero="random"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></svg>Random</button>
        </div>
      </section>
      <aside class="widgets" id="widgets" aria-label="Widgets"></aside>
    </div>
  </main>

  <div class="win-layer" id="win-layer" aria-live="polite"><div class="snap-hint" id="snap-hint"></div></div>

  <nav class="dock os-glass" id="dock" aria-label="Dock"></nav>
  <div class="dk-tip" id="dk-tip" role="tooltip"></div>
  <div class="start os-glass" id="start" role="dialog" aria-label="Start menu"></div>

  <script src="assets/core.js"></script>
  <script src="assets/thumbs.js"></script>
  <script src="assets/os.js"></script>
</body>
</html>
