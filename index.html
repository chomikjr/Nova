<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04020a">
  <meta name="description" content="Nova OS — a free game desktop in your browser. 400+ games, a built-in web browser, achievements, XP, daily and weekly challenges and cloud saves.">
  <title>Nova OS</title>
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nova.delsea.one/">
  <meta property="og:title" content="Nova OS — a free game desktop">
  <meta property="og:description" content="Play free games on a desktop in your browser, with XP, achievements, challenges, music and cloud saves.">
  <meta property="og:image" content="https://nova.delsea.one/assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c4b5fd' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="assets/core.css">
  <link rel="stylesheet" href="assets/os.css">
  <link rel="stylesheet" href="assets/galaxy.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/nebula.css">
</head>
<body class="os">
  <div class="boot" id="boot" aria-hidden="true"></div>
  <div id="wco-bar" aria-hidden="true"><span class="wco-logo">NOVA</span></div>
  <section id="boot-layer" aria-label="Starting Nova">
    <canvas id="boot-canvas"></canvas>
    <div id="boot-content">
      <h1 class="boot-logo" id="boot-title">NOVA</h1>
      <p class="boot-sub" id="boot-subtitle">GAME OS // V3</p>
      <div id="boot-bar-wrap"><div id="boot-bar"></div></div>
      <div id="boot-status-msg">INITIALIZING...</div>
    </div>
    <p class="boot-credit" id="boot-credit">Shell by Abel · Nova by Ryan</p>
  </section>

  <main class="os-home" id="os-home" aria-label="Desktop">
    <header id="hud-top"><div class="hud-day" id="os-day">Monday</div><div class="hud-date" id="os-date"></div></header>
    <nav class="desk-icons" id="desk-icons" aria-label="Desktop shortcuts"></nav>
    <aside id="widgets" class="right-sidebar" aria-label="Quick access"></aside>
  </main>

  <div class="win-layer" id="win-layer" aria-live="polite"><div class="snap-hint" id="snap-hint"></div></div>

  <nav class="dock os-glass" id="dock" aria-label="Dock"></nav>
  <div class="dk-tip" id="dk-tip" role="tooltip"></div>
  <div class="start os-glass" id="start" role="dialog" aria-label="Start menu"></div>

  <script src="assets/nebula-boot.js"></script>
  <script src="assets/shaders.js"></script>
  <script src="assets/core.js"></script>
  <script src="assets/lockdown.js"></script>
  <script src="assets/thumbs.js"></script>
  <script src="assets/os.js"></script>
  <script src="assets/nova-live.js"></script>
  <script src="assets/eggs.js"></script>
</body>
</html>
