<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Nova — offline</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif; }
    body { display: grid; place-items: center; text-align: center; overflow: hidden; }
    .lines { position: fixed; inset: 0; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.05) 0deg 1deg, transparent 1deg 6deg); mask-image: radial-gradient(circle at 50% 50%, transparent 8%, #000 30%, transparent 75%); -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 8%, #000 30%, transparent 75%); }
    main { position: relative; display: grid; gap: 14px; justify-items: center; padding: 24px; }
    h1 { margin: 0; font-family: 'Orbitron', 'Rajdhani', sans-serif; font-weight: 900; font-size: clamp(36px, 9vw, 56px); letter-spacing: 14px; padding-left: 14px; }
    .sub { margin: 0; color: #777; font-size: 12px; font-weight: 700; letter-spacing: 6px; text-transform: uppercase; }
    p { margin: 10px 0 0; color: #aaa; font-size: 17px; font-weight: 600; max-width: 380px; line-height: 1.4; }
    button { margin-top: 10px; height: 44px; padding: 0 26px; border-radius: 12px; border: 1px solid #333; background: #111; color: #fff; font: inherit; font-size: 15px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
    button:hover { background: #fff; color: #000; border-color: #fff; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f87171; margin-right: 8px; box-shadow: 0 0 10px #f87171; }
  </style>
</head>
<body>
  <div class="lines" aria-hidden="true"></div>
  <main>
    <h1>NOVA</h1>
    <div class="sub"><span class="dot" aria-hidden="true"></span>No connection</div>
    <p>You’re offline. Nova will reconnect by itself as soon as your internet is back.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>addEventListener('online', () => location.reload());</script>
</body>
</html>
